PACKAGE_NAME="fl2000-drm"
PACKAGE_VERSION="0.0.1-6x"
AUTOINSTALL="yes"
# Ported to Linux 6.8 APIs only; other kernel series are skipped instead of failing the build
BUILD_EXCLUSIVE_KERNEL="^6\.8\."
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
BUILT_MODULE_NAME[0]="fl2000"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="it66121"
DEST_MODULE_LOCATION[1]="/updates/dkms"
